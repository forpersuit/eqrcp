name = "eqt-feedback-api"
main = "src/index.ts"
compatibility_date = "2026-06-29"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "eqt-feedback-db"
# Replace with actual D1 database ID after create
database_id = "a58d4980-8ea3-4c30-8368-b1ba871d9acd"

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "eqt-feedback-bucket"

[vars]
# Non-sensitive notification target (token → wrangler secret TELEGRAM_BOT_TOKEN)
TELEGRAM_CHAT_ID = "1880182104"
CF_ACCESS_ALLOWED_EMAILS = "admin@eqt.net.im"
# Future email path (plan): From sendfeedback@ / To support@ via secrets
# MAIL_SENDER, MAIL_SEND_SERVER, MAIL_SEND_SAFE_PORT as vars when enabled
# MAIL_SENDER_PASSWORD, FEEDBACK_MAIL_TO as secrets when enabled

routes = [
  { pattern = "feedback.eqt.net.im", custom_domain = true }
]
