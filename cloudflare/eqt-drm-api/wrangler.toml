name = "eqt-drm-api"
main = "src/index.ts"
compatibility_date = "2026-06-19"
logpush = true

# D1 Database binding. DB is bound in the code.
[[d1_databases]]
binding = "DB"
database_name = "eqt-drm-db"
database_id = "f77e30fd-6dee-4062-a916-e8f4f717036d"

# R2 Bucket for crash report storage
[[r2_buckets]]
binding = "CRASH_BUCKET"
bucket_name = "eqt-crash-reports"

[vars]
R2_PUBLIC_URL = "https://download.eqt.net.im"
CF_ACCESS_ALLOWED_EMAILS = "admin@eqt.net.im"
MAIL_SENDER = "noreply@eqt.net.im"
MAIL_SEND_SERVER = "smtpserver.301098.xyz"
MAIL_SEND_SAFE_PORT = "465"
# Non-sensitive notification target (token → wrangler secret TELEGRAM_BOT_TOKEN)
TELEGRAM_CHAT_ID = "1880182104"

routes = [
  { pattern = "lic.eqt.net.im", custom_domain = true },
  { pattern = "download.eqt.net.im", custom_domain = true }
]
