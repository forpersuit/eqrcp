<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EQT Pro - P2P Transfer Shell</title>
    <link rel="icon" href="assets/favicon.png" type="image/png"/>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-card {
            background: #1e293b;
            padding: 28px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid #334155;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .brand-title {
            font-weight: 800;
            font-size: 22px;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }
        .pro-tag {
            background: #0284c7;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
        .mode-icon {
            font-size: 44px;
            margin-bottom: 8px;
        }
        .mode-title {
            font-weight: 700;
            font-size: 18px;
            color: #f1f5f9;
            margin-bottom: 16px;
        }
        .status-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            color: #94a3b8;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 20px;
        }
        .status-text {
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .action-btn {
            width: 100%;
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        .action-btn:hover:not(:disabled) {
            background: #0369a1;
        }
        .footer-info {
            margin-top: 16px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="app-card">
        <div class="brand-badge">
            <span class="brand-title">EQT Pro</span>
            <span class="pro-tag">p.eqt.net.im</span>
        </div>

        <div id="mode-icon" class="mode-icon">⚡</div>
        <div id="mode-title" class="mode-title">P2P WAN Transfer</div>

        <div class="status-box">
            <div id="p2p-conn-status" class="status-text">📡 正在连接公网信令服务器...</div>
            <div id="room-token-info" style="font-size: 11px; color: #64748b;">Room: N/A</div>
        </div>

        <div id="action-area">
            <button id="p2p-main-btn" class="action-btn" disabled>
                ⏳ 等待电脑端 P2P 物理连接...
            </button>
        </div>

        <div class="footer-info">
            独立微型打洞服务 • 无污染零阻断
        </div>
    </div>

    <script>
        (function() {
            const path = window.location.pathname;
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token') || '';
            const join = params.get('join') || '';

            const modeIconEl = document.getElementById('mode-icon');
            const modeTitleEl = document.getElementById('mode-title');
            const tokenInfoEl = document.getElementById('room-token-info');
            const statusEl = document.getElementById('p2p-conn-status');
            const mainBtn = document.getElementById('p2p-main-btn');

            tokenInfoEl.innerText = `Token: ${token || 'N/A'}${join ? ' | Join: ' + join : ''}`;

            let isShare = path.includes('/share');
            let isReceive = path.includes('/receive');
            let isChat = path.includes('/chat');

            if (isShare) {
                document.title = 'EQT Pro - 文件下载';
                modeIconEl.innerText = '🖼️';
                modeTitleEl.innerText = '文件下载 (Share 模式)';
            } else if (isReceive) {
                document.title = 'EQT Pro - 文件上传';
                modeIconEl.innerText = '📤';
                modeTitleEl.innerText = '文件上传 (Receive 模式)';
            } else if (isChat) {
                document.title = 'EQT Pro - 加密聊天';
                modeIconEl.innerText = '💬';
                modeTitleEl.innerText = '双向 P2P 聊天 (Chat 模式)';
            }

            const updateStatus = (msg, color = '#38bdf8') => {
                if (statusEl) {
                    statusEl.innerText = msg;
                    statusEl.style.color = color;
                }
            };

            if (token && window.RTCPeerConnection) {
                const signalHost = 'https://signal.eqt.net.im';
                const pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        fetch(`${signalHost}/signal/push`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ room: token, sender: 'mobile', signal: { type: 'candidate', candidate: event.candidate } })
                        }).catch(() => {});
                    }
                };

                let receivedChunks = [];
                let expectedSize = 0;
                let receivedSize = 0;
                let fileName = 'received_file';

                pc.ondatachannel = (event) => {
                    const channel = event.channel;
                    channel.onopen = () => {
                        updateStatus('⚡ 公网 P2P 直连通道已打通！', '#4ade80');
                        if (mainBtn) {
                            mainBtn.disabled = false;
                            mainBtn.innerText = '⬇️ 开始传输文件';
                            mainBtn.onclick = () => {
                                channel.send(JSON.stringify({ action: 'request_download' }));
                                mainBtn.innerText = '⏳ 正在接收二进制流...';
                            };
                        }
                    };

                    channel.onmessage = (e) => {
                        if (typeof e.data === 'string') {
                            try {
                                const meta = JSON.parse(e.data);
                                if (meta.type === 'meta') {
                                    fileName = meta.name || fileName;
                                    expectedSize = meta.size || 0;
                                }
                            } catch(err) {}
                        } else if (e.data instanceof ArrayBuffer) {
                            receivedChunks.push(e.data);
                            receivedSize += e.data.byteLength;
                            updateStatus(`📥 已物理接收: ${Math.round(receivedSize / 1024)} KB`, '#38bdf8');
                            
                            if (receivedSize >= expectedSize && expectedSize > 0) {
                                updateStatus('✅ 文件物理接收完整！', '#4ade80');
                                const blob = new Blob(receivedChunks);
                                const a = document.createElement('a');
                                a.href = URL.createObjectURL(blob);
                                a.download = fileName;
                                a.click();
                                
                                if (mainBtn) {
                                    mainBtn.innerText = '🎉 接收完成，点击重新保存';
                                    mainBtn.onclick = () => a.click();
                                }
                            }
                        }
                    };
                };

                pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                    return fetch(`${signalHost}/signal/push`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ room: token, sender: 'mobile', signal: pc.localDescription })
                    });
                }).then(() => {
                    updateStatus('📡 已向信令池发送 Offer，等待电脑响应...', '#fbbf24');
                }).catch(err => {
                    updateStatus('❌ 信令打洞异常: ' + err.message, '#f87171');
                });
            }
        })();
    </script>
</body>
</html>
