<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <title>EQT Pro WAN Transfer</title>
</head>
<body>
    <main></main>

    <script src="js/transport.js"></script>
    <script>
        (function() {
            const path = window.location.pathname;
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token') || '';
            const join = params.get('join') || '';

            const loadScript = (src, callback) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = callback;
                document.head.appendChild(s);
            };

            if (path.includes('/receive')) {
                loadScript('js/receive.js', () => window.initReceiveModule && window.initReceiveModule(token));
            } else if (path.includes('/chat')) {
                loadScript('js/chat.js', () => window.initChatModule && window.initChatModule(token, join));
            } else {
                loadScript('js/share.js', () => window.initShareModule && window.initShareModule(token));
            }
        })();
    </script>
</body>
</html>
