# eqt-website — Cloudflare Pages configuration
# Deploys the frontend (landing page, pricing, portal, legal pages) to the
# "eqt" Pages project, which serves www.eqt.net.im.
#
# Usage:
#   npm run deploy          # deploy to production (www.eqt.net.im)
#   wrangler pages deploy ./ --project-name=eqt --branch <branch>  # preview
#
# NOTE: The project name is "eqt" (not "eqt-website") because the "eqt" Pages
# project owns the www.eqt.net.im custom domain. The "eqt-website" project on
# Pages is orphaned and should not be used.

name = "eqt-website"
pages_build_output_dir = "."
