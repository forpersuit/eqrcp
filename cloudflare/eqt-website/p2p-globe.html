<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EQT Pro 全球 P2P 直连 3D 实时拓扑大屏</title>
  <!-- Load Globe.gl & Three.js via high-speed UNPKG CDN -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }
    #globeViz {
      flex: 1;
      height: 100%;
      position: relative;
    }
    .sidebar {
      width: 380px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(51, 65, 85, 0.6);
      display: flex;
      flex-direction: column;
      padding: 24px;
      z-index: 10;
    }
    .header h2 {
      font-size: 20px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
    }
    .stat-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
    }
    .conn-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .conn-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(71, 85, 105, 0.5);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .conn-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .conn-card.cross-border {
      border-color: #0284c7;
      background: rgba(14, 165, 233, 0.12);
    }
    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .flag-pair {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .geo-details {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .cross-tag {
      background: #0284c7;
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .overlay-title {
      position: absolute;
      top: 24px;
      left: 28px;
      pointer-events: none;
      z-index: 10;
    }
    .overlay-title h1 {
      font-size: 24px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    .overlay-title p {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="globeViz">
    <div class="overlay-title">
      <h1>🌐 EQT Pro 全球 P2P 直连 3D 实时拓扑大屏</h1>
      <p>Powered by Globe.gl & WebGL Hardware Acceleration | Real-time WAN P2P Arc Streams</p>
    </div>
  </div>

  <div class="sidebar">
    <div class="header">
      <h2>🌐 实时连接看板</h2>
      <p>Cloudflare Serverless 边缘节点注入地理归属与 3D 坐标</p>
      <div class="stat-badge" id="total-badge">活跃跨国会话: 0 个</div>
    </div>

    <div class="conn-list" id="conn-list">
      <!-- Connection cards injected dynamically -->
    </div>
  </div>

  <script>
    // Real-time connections dataset
    let connectionsData = [
      {
        room_id: 'r8k3m9p1',
        is_cross_border: true,
        host: { country: 'CN', ip: '114.114.xxx.xxx', lat: 31.23, lon: 121.47 }, // Shanghai
        client: { country: 'US', ip: '8.8.xxx.xxx', lat: 37.77, lon: -122.41 } // San Francisco
      },
      {
        room_id: 'q2m4k8p9',
        is_cross_border: true,
        host: { country: 'JP', ip: '210.140.xxx.xxx', lat: 35.67, lon: 139.65 }, // Tokyo
        client: { country: 'DE', ip: '82.165.xxx.xxx', lat: 52.52, lon: 13.40 } // Berlin
      },
      {
        room_id: 'm7x1k3a2',
        is_cross_border: true,
        host: { country: 'CN', ip: '120.24.xxx.xxx', lat: 22.54, lon: 114.05 }, // Shenzhen
        client: { country: 'SG', ip: '118.189.xxx.xxx', lat: 1.35, lon: 103.81 } // Singapore
      }
    ];

    // Prepare Arcs dataset for Globe.gl
    function getArcsData() {
      return connectionsData.map(c => ({
        startLat: c.host.lat,
        startLng: c.host.lon,
        endLat: c.client.lat,
        endLng: c.client.lon,
        color: c.is_cross_border ? ['#38bdf8', '#818cf8'] : ['#4ade80', '#22c55e']
      }));
    }

    // Prepare Rings dataset for Globe.gl (Pulsating nodes)
    function getRingsData() {
      const rings = [];
      connectionsData.forEach(c => {
        rings.push({ lat: c.host.lat, lng: c.host.lon, color: '#38bdf8' });
        rings.push({ lat: c.client.lat, lng: c.client.lon, color: '#818cf8' });
      });
      return rings;
    }

    // Initialize 3D Globe
    const globe = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#38bdf8')
      .atmosphereAltitude(0.25)

      // Dynamic Arc Stream Animations
      .arcsData(getArcsData())
      .arcColor('color')
      .arcDashLength(0.4)
      .arcDashGap(0.2)
      .arcDashAnimateTime(2000)
      .arcStroke(1.5)

      // Pulsating Rings on Nodes
      .ringsData(getRingsData())
      .ringColor('color')
      .ringMaxRadius(6)
      .ringPropagationSpeed(3)
      .ringRepeatPeriod(1000);

    // Auto rotate globe
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 1.2;

    // Sidebar UI Sync
    function updateSidebar() {
      const listEl = document.getElementById('conn-list');
      const badgeEl = document.getElementById('total-badge');
      badgeEl.innerText = `活跃跨国会话: ${connectionsData.length} 个`;

      listEl.innerHTML = connectionsData.map(c => `
        <div class="conn-card ${c.is_cross_border ? 'cross-border' : ''}">
          <div class="card-title">
            <span class="flag-pair">🌐 ${c.host.country} ➔ ${c.client.country}</span>
            ${c.is_cross_border ? '<span class="cross-tag">跨国 P2P</span>' : '<span class="cross-tag" style="background:#16a34a">同国 P2P</span>'}
          </div>
          <div class="geo-details">
            <div><strong>Host 端:</strong> ${c.host.ip} (${c.host.country})</div>
            <div><strong>Client 端:</strong> ${c.client.ip} (${c.client.country})</div>
            <div><strong>会话房间:</strong> <code>${c.room_id}</code></div>
          </div>
        </div>
      `).join('');
    }

    updateSidebar();

    // Fetch live connections from Worker API
    async function fetchLiveConnections() {
      try {
        const res = await fetch('https://signal.eqt.net.im/api/v1/p2p/admin/connections');
        const json = await res.json();
        if (json.code === 200 && Array.isArray(json.connections) && json.connections.length > 0) {
          connectionsData = json.connections.map(c => ({
            room_id: c.room_id,
            is_cross_border: c.is_cross_border,
            host: c.host,
            client: c.client || c.host
          }));
          globe.arcsData(getArcsData()).ringsData(getRingsData());
          updateSidebar();
        }
      } catch (err) {
        // Keep smooth demo data if offline
      }
    }

    setInterval(fetchLiveConnections, 5000);
  </script>
</body>
</html>
