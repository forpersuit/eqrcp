name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-wails-windows:
    name: Release Windows GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/gui/frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build Chat v2 frontend
        working-directory: pkg/chat/v2/web
        run: |
          npm ci
          npm run build
      - name: Build Wails (windows/amd64)
        working-directory: desktop/gui
        # ⚠️ 安全不变式:release 二进制必须恒连生产环境。禁止在此添加任何
        # -tags eqtdev / -X 测试 URL 注入。代码默认值已保证无注入即生产
        # (见 docs/deploy/gui-environment.md 与 pkg/server/env_defaults*.go)。
        run: wails build -clean -platform windows/amd64
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          TAG="${{ github.ref_name }}"
          cp desktop/gui/build/bin/eqt-desktop.exe out/eqt-desktop-windows-amd64.exe
          python -c "
          import zipfile, os
          tag = os.environ.get('TAG', 'latest')
          zip_name = f'out/EQT-{tag}-windows-amd64.zip'
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('desktop/gui/build/bin/eqt-desktop.exe', 'EQT.exe')
          "
        env:
          TAG: ${{ github.ref_name }}
      - name: Generate Update Signature
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          go run scripts/generate-update-sig/main.go out/eqt-desktop-windows-amd64.exe
          go run scripts/generate-update-sig/main.go "out/EQT-${TAG}-windows-amd64.zip"
        env:
          TAG: ${{ github.ref_name }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wails-windows-artifacts
          path: out/*

  deploy:
    name: Deploy to GitHub Release & Cloudflare Pages
    needs: [release-wails-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp-artifacts
      - name: Consolidate artifacts
        run: |
          mkdir -p out
          find temp-artifacts -type f -exec cp {} out/ \;
          ls -R out
      - name: Generate update-metadata.json
        # 产物只进 GitHub Release + R2(download.eqt.net.im)。
        # 不再复制进 cloudflare/eqt-website/ —— www 只放产品页,不托管安装包。
        run: |
          go run scripts/generate-update-metadata/main.go ${{ github.ref_name }} out out/update-metadata.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*
      - name: Deploy static site to Cloudflare Pages
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler pages deploy cloudflare/eqt-website --project-name=eqt --branch=master
          else
            echo "CLOUDFLARE_API_TOKEN is not set, skipping Cloudflare Pages deployment."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy to Cloudflare R2
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            BUCKET="${R2_BUCKET_NAME:-eqt-downloads}"
            echo "Uploading artifacts to Cloudflare R2 bucket: $BUCKET"
            for file in out/*; do
              filename=$(basename "$file")
              echo "Uploading $filename to downloads/${{ github.ref_name }}/$filename ..."
              npx wrangler r2 object put "$BUCKET/downloads/${{ github.ref_name }}/$filename" --file "$file" --remote
              echo "Uploading $filename to downloads/latest/$filename ..."
              npx wrangler r2 object put "$BUCKET/downloads/latest/$filename" --file "$file" --remote
            done
          else
            echo "CLOUDFLARE_API_TOKEN is not set, skipping R2 deployment."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      # ── Notifications ────────────────────────────────────────

      - name: Notify release success via Telegram
        if: success()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="🎉 <b>[Release Succeeded]</b>
          <b>Tag:</b> <code>${{ github.ref_name }}</code>
          <b>Repository:</b> ${{ github.repository }}
          <b>Workflow:</b> ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=HTML" || echo "⚠️ Telegram notification failed"

      - name: Notify release failure via Telegram
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="🚨 <b>[Release Failed]</b>
          <b>Tag:</b> <code>${{ github.ref_name }}</code>
          <b>Repository:</b> ${{ github.repository }}
          <b>Workflow:</b> ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=HTML" || echo "⚠️ Telegram notification failed"
