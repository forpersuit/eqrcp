# Deploy — 生产环境部署流水线
#
# CI 在 master 通过后自动触发，经手动审批后部署到生产环境。
# 具备差异化增量部署能力: 仅部署有代码改动的 Workers 与 Pages 服务，避免全量重构。
#
# 流程: push → CI (ci.yml) → 本工作流触发 → 等待生产审批 (production environment) → 增量部署
#
# 安全不变式:
#   1. 生产环境部署必须经过 GitHub Environment "production" 审批。
#   2. 严格绑定生产域名: lic.eqt.net.im / feedback.eqt.net.im / eqt.net.im / admin.eqt.net.im。

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force deploy all Cloudflare production services'
        type: boolean
        default: false

# 防止多个部署互相覆盖
concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. 变更检测 ──────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    # 仅 push 到 master 的 CI 通过后才触发，或手动触发
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      drm_api: ${{ github.event.inputs.force_all == 'true' || steps.filter.outputs.drm_api }}
      feedback_api: ${{ github.event.inputs.force_all == 'true' || steps.filter.outputs.feedback_api }}
      website: ${{ github.event.inputs.force_all == 'true' || steps.filter.outputs.website }}
      admin: ${{ github.event.inputs.force_all == 'true' || steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 50

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            drm_api:
              - 'cloudflare/eqt-drm-api/**'
            feedback_api:
              - 'cloudflare/eqt-feedback-api/**'
            website:
              - 'cloudflare/eqt-website/**'
            admin:
              - 'cloudflare/eqt-admin/**'

  # ── 2. 生产部署 (受 production 环境审批门禁保护) ────────────────
  deploy:
    name: Deploy to Production
    needs: [detect-changes]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Workers ──────────────────────────────────────────────

      - name: Deploy eqt-drm-api Worker
        if: needs.detect-changes.outputs.drm_api == 'true'
        working-directory: cloudflare/eqt-drm-api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'b8b5c5020effb7d1ac41f586c44b6e82' }}

      - name: Deploy eqt-feedback-api Worker
        if: needs.detect-changes.outputs.feedback_api == 'true'
        working-directory: cloudflare/eqt-feedback-api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'b8b5c5020effb7d1ac41f586c44b6e82' }}

      # ── Record versions for rollback ─────────────────────────
      - name: Record Worker versions
        if: always()
        run: |
          {
            echo "## 🚀 Deploy Summary"
            echo ""
            echo "**Commit**: \`${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}\`"
            echo "**Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "### Worker status"
            echo "- eqt-drm-api: $( [ "${{ needs.detect-changes.outputs.drm_api == 'true' }}" = "true" ] && echo 'Deployed' || echo 'Skipped (no changes)' )"
            echo "- eqt-feedback-api: $( [ "${{ needs.detect-changes.outputs.feedback_api == 'true' }}" = "true" ] && echo 'Deployed' || echo 'Skipped (no changes)' )"
            echo "- eqt-website: $( [ "${{ needs.detect-changes.outputs.website == 'true' }}" = "true" ] && echo 'Deployed' || echo 'Skipped (no changes)' )"
            echo "- eqt-admin: $( [ "${{ needs.detect-changes.outputs.admin == 'true' }}" = "true" ] && echo 'Deployed' || echo 'Skipped (no changes)' )"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Pages ────────────────────────────────────────────────

      - name: Build and Deploy eqt-admin
        if: needs.detect-changes.outputs.admin == 'true'
        working-directory: cloudflare/eqt-admin
        run: |
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name=eqt-admin --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'b8b5c5020effb7d1ac41f586c44b6e82' }}

      - name: Deploy eqt-website to Pages
        if: needs.detect-changes.outputs.website == 'true'
        working-directory: cloudflare/eqt-website
        run: npx wrangler pages deploy ./ --project-name=eqt --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'b8b5c5020effb7d1ac41f586c44b6e82' }}

      # ── Notifications ────────────────────────────────────────

      - name: Notify success via Telegram
        if: success()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DRM_STATUS="${{ needs.detect-changes.outputs.drm_api == 'true' }}"
          FB_STATUS="${{ needs.detect-changes.outputs.feedback_api == 'true' }}"
          WEB_STATUS="${{ needs.detect-changes.outputs.website == 'true' }}"
          ADMIN_STATUS="${{ needs.detect-changes.outputs.admin == 'true' }}"

          MESSAGE="✅ [Production Deploy Succeeded]
          Repository: ${{ github.repository }}
          Workflow: ${RUN_URL}
          - eqt-drm-api: $( [ "$DRM_STATUS" = "true" ] && echo "Deployed" || echo "Skipped" )
          - eqt-feedback-api: $( [ "$FB_STATUS" = "true" ] && echo "Deployed" || echo "Skipped" )
          - eqt-website: $( [ "$WEB_STATUS" = "true" ] && echo "Deployed" || echo "Skipped" )
          - eqt-admin: $( [ "$ADMIN_STATUS" = "true" ] && echo "Deployed" || echo "Skipped" )"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown" || echo "⚠️ Telegram notification failed"

      - name: Notify failure via Telegram
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="🚨 [Production Deploy Failed]
          Repository: ${{ github.repository }}
          Workflow: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown" || echo "⚠️ Telegram notification failed"
