# Deploy — 部署流水线
#
# CI 在 master 通过后自动触发，经手动审批后部署到生产环境。
#
# 流程: push → CI (ci.yml) → 本工作流触发 → 等待审批 → 部署
#
# 使用方式:
#   1. 在 GitHub repo → Settings → Environments → 创建 "production" 环境
#   2. 添加 Required reviewers（至少 1 人）
#   3. 每次 push 到 master，CI 通过后本工作流进入等待审批状态
#   4. 审批后自动部署 Workers + Pages

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# 防止多个部署互相覆盖
concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 检出 CI 通过的精确 commit
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Workers ──────────────────────────────────────────────

      - name: Deploy eqt-drm-api Worker
        working-directory: cloudflare/eqt-drm-api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy eqt-feedback-api Worker
        working-directory: cloudflare/eqt-feedback-api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # ── Pages ────────────────────────────────────────────────

      - name: Build eqt-admin
        working-directory: cloudflare/eqt-admin
        run: |
          npm ci
          npm run build

      - name: Deploy eqt-website to Pages
        working-directory: cloudflare/eqt-website
        run: npx wrangler pages deploy ./ --project-name=eqt --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy eqt-admin to Pages
        run: npx wrangler pages deploy cloudflare/eqt-admin/dist --project-name=eqt-admin --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # ── Notifications ────────────────────────────────────────

      - name: Notify success via Telegram
        if: success()
        run: |
          COMMIT_MSG="${{ github.event.workflow_run.head_commit.message }}"
          COMMIT_URL="${{ github.event.workflow_run.head_repository.html_url }}/commit/${{ github.event.workflow_run.head_sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="✅ [Deploy Succeeded]
          Repository: ${{ github.repository }}
          Commit: ${COMMIT_MSG:0:80}
          URL: ${COMMIT_URL}
          Workflow: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown" || echo "⚠️ Telegram notification failed (token/chat_id may not be configured)"

      - name: Notify failure via Telegram
        if: failure()
        run: |
          COMMIT_MSG="${{ github.event.workflow_run.head_commit.message }}"
          COMMIT_URL="${{ github.event.workflow_run.head_repository.html_url }}/commit/${{ github.event.workflow_run.head_sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="🚨 [Deploy Failed]
          Repository: ${{ github.repository }}
          Commit: ${COMMIT_MSG:0:80}
          URL: ${COMMIT_URL}
          Workflow: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown" || echo "⚠️ Telegram notification failed (token/chat_id may not be configured)"
