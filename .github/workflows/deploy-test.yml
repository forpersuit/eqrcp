# Deploy Test — 测试环境部署流水线
#
# 将 wrangler.toml 的 [env.test] 配置部署到测试自定义域名(lic-test.eqt.net.im / feedback-test.eqt.net.im),
# 与生产 deploy.yml(GitHub Environment production 审批)完全隔离。
#
# 触发:
#   - push 到 dev 分支(长命分支,自动部署,快速迭代)
#   - 手动触发(workflow_dispatch,任意分支)
#
# 安全:测试 Worker 的 [env.test] 绑定专属测试域名,绝不抢占生产 lic.eqt.net.im。

name: Deploy Test

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 快速迭代:同一时间只保留最新一次测试部署
concurrency:
  group: deploy-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-test:
    name: Deploy to Test (lic-test.eqt.net.im)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy eqt-drm-api (test)
        working-directory: cloudflare/eqt-drm-api
        run: npx wrangler deploy --env test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'b8b5c5020effb7d1ac41f586c44b6e82' }}

      - name: Deploy eqt-feedback-api (test)
        working-directory: cloudflare/eqt-feedback-api
        run: npx wrangler deploy --env test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'b8b5c5020effb7d1ac41f586c44b6e82' }}

      # ── Pages (Test) ─────────────────────────────────────────

      - name: Deploy eqt-website to Pages (test)
        working-directory: cloudflare/eqt-website
        run: npx wrangler pages deploy ./ --project-name=eqt-test --branch=dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'b8b5c5020effb7d1ac41f586c44b6e82' }}

      - name: Notify via Telegram
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ "${{ job.status }}" == "success" ]]; then
            MESSAGE="🧪 [Test Deploy Succeeded] (lic-test.eqt.net.im)
            Branch: ${{ github.ref_name }}
            Workflow: ${RUN_URL}"
          else
            MESSAGE="🚨 [Test Deploy Failed] (lic-test.eqt.net.im)
            Branch: ${{ github.ref_name }}
            Workflow: ${RUN_URL}"
          fi
          # 通知到测试群;若未单独配置 TEST_TELEGRAM_CHAT_ID,则复用生产群
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TEST_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown" || echo "⚠️ Telegram notification failed (token/chat_id may not be configured)"
